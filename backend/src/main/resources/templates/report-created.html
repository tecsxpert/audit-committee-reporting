<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: auto; }
        .header { background: #1B4F8A; color: white; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; }
        .content { padding: 20px 0; }
        .field { margin-bottom: 12px; }
        .label { font-weight: bold; color: #555; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; background: #1B4F8A; color: white; font-size: 13px; }
        .footer { margin-top: 20px; font-size: 12px; color: #999; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>New Audit Report Created</h2></div>
    <div class="content">
        <div class="field"><span class="label">Title:</span> <span th:text="${title}"></span></div>
        <div class="field"><span class="label">Category:</span> <span th:text="${category}"></span></div>
        <div class="field"><span class="label">Status:</span> <span class="badge" th:text="${status}"></span></div>
        <div class="field"><span class="label">Risk Score:</span> <span th:text="${riskScore}"></span>/10</div>
        <div class="field"><span class="label">Assigned To:</span> <span th:text="${assignedTo}"></span></div>
    </div>
    <div class="footer">This is an automated notification from Audit Committee Reporting System</div>
</div>
</body>
</html>
