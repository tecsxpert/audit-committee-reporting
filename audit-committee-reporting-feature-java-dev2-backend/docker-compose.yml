# docker-compose.yml
# Run with: docker-compose up --build
# Stop with: docker-compose down
# Full reset: docker-compose down -v (deletes database data too)

version: "3.9"

services:

  # ── 1. PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: tool27_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Redis Cache ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tool27_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Spring Boot Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: tool27_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST:          redis
      SPRING_REDIS_PORT:          6379
      JWT_SECRET:                 ${JWT_SECRET}
      MAIL_HOST:                  ${MAIL_HOST}
      MAIL_PORT:                  ${MAIL_PORT}
      MAIL_USERNAME:              ${MAIL_USERNAME}
      MAIL_PASSWORD:              ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 4. Python AI Service ────────────────────────────────────────────────
  ai-service:
    build: ./ai-service
    container_name: tool27_ai
    ports:
      - "5000:5000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 5. React Frontend ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: tool27_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:   # keeps database data between restarts